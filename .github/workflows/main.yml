
name: ADR RDP Gaming Edition

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name SecurityLayer -Value 2

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create ADR User
        shell: pwsh
        run: |
          $password = [guid]::NewGuid().ToString() + "A9!"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name ADR -Password $secure `
            -AccountNeverExpires -PasswordNeverExpires

          Add-LocalGroupMember -Group Administrators -Member ADR
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member ADR

          "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install Gaming Tools
        shell: pwsh
        run: |
          $apps = @(
            "7zip.7zip",
            "Google.Chrome",
            "Mozilla.Firefox",
            "Valve.Steam",
            "EpicGames.EpicGamesLauncher",
            "Microsoft.DirectX"
          )

          foreach ($app in $apps) {
            winget install --id $app `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not install $app"
            }
          }

      - name: Configure Gaming Environment
        shell: pwsh
        run: |
          powercfg /setactive SCHEME_MIN

          New-Item -ItemType Directory `
            -Path C:\Games -Force

          New-Item -ItemType Directory `
            -Path C:\Downloads -Force

          Write-Host "Gaming environment prepared"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $path = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $path

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$path`" /quiet /norestart" `
            -Wait

          Remove-Item $path -Force

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="adr-rdp-$env:GITHUB_RUN_ID"

          $ip = $null

          for ($i = 0; $i -lt 20; $i++) {
            $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

            if ($ip) { break }

            Start-Sleep -Seconds 5
          }

          if (-not $ip) {
            throw "Tailscale connection failed"
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: RDP Information
        shell: pwsh
        run: |
          Write-Host "=============================="
          Write-Host "ADR RDP GAMING"
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "USER: ADR"
          Write-Host "Password stored securely in workflow environment"
          Write-Host "=============================="

      - name: Keep Machine Active
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "ADR RDP Active: $(Get-Date)"
            Start-Sleep -Seconds 300
          }
          
